_ > nanoagent.plugin.v0001.ManifestConfig:
id: sportsbrief-standings
name: League Standings
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  pin_standings:
    description: Pin the task's answer key, the whole bundled season (with its sha256) and the standings the rules give through the date
  list_games:
    description: List a bundled season's games played on or before a date, in date order, with the season's sha256
  tally_records:
    description: Tally every team's wins, losses, points for and points against over a season's games played on or before a date; records the season it read under standings/ in the workspace

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  rank-teams:
    description: Build the league standings of a season through a date, all 8 teams ranked with their records, winning percentage, games behind and point differential
    runner: agent
    tools: [tally_records]
    reference: pin_standings
    instructions: |-
      Plan. Exactly two tool calls: (1) tally_records once, with the task's season and through_date exactly as given; (2) submit. Work from its records alone: never recount the games.
      Per team. wins and losses as given. point_diff = points_for - points_against. win_pct = wins / (wins + losses) rounded to 3 decimals, half away from zero (4 of 5 is 0.8, 2 of 3 is 0.667, 5 of 9 is 0.556); a team with no games has 0.0.
      Order. Best first: the greater share of games won (compare wins / (wins + losses) exactly, as fractions: 0 of 0 counts as 0); then the greater point_diff; then the team name in alphabetical order. rank is the position in that order, 1 to 8, no ties.
      Games behind. The leader is the team ranked 1. For every team, games_behind = ((leader wins - wins) + (losses - leader losses)) / 2, computed exactly as written: a multiple of 0.5 such as 0.0, 1.5 or 3.0, 0.0 for the leader, and negative only when a team's wins exceed the leader's by more than its losses do.
      Submit. season and through_date exactly as given, and rows: all 8 teams, rank 1 first, each with rank, team (spelled exactly as tally_records gives it), wins, losses, win_pct, games_behind and point_diff. Reason briefly: one short line of numbers per team, no prose.
  list-games:
    description: List a bundled season's games played on or before a date, in date order, so a person can read the results the standings come from
    runner: tool
    tools: [list_games]
    reference: null
    instructions: |-
      Call list_games with the season (gcbl-2025 or gcbl-2026) and the last day to count, a date YYYY-MM-DD. Use it when the person wants to see the games; the rank-teams task builds the standings.
